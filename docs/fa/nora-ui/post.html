<style>
/* ── صفحهٔ خواندن مطلب: ستون آرام، تیترها با نفس، رسانه بی‌لرزش ── */
#rbar{position:fixed;top:0;right:0;height:3px;width:0;background:#0071E3;z-index:60;transition:width .1s linear;border-radius:0 0 2px 2px}
.pb-hero{margin-top:14px;border-radius:22px;overflow:hidden;border:.5px solid var(--hairline);background:var(--surface)}
.pb-cover{aspect-ratio:16/8;background:var(--g,linear-gradient(135deg,#1E6FD0,#0A3A82));position:relative}
.pb-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pb-cover .kn{position:absolute;top:12px;right:12px;display:flex;gap:6px;align-items:center}
.pb-head{padding:18px 18px 6px}
.pb-head h1{font-size:23px;line-height:1.65;margin:10px 0 8px;font-weight:800}
.pb-lead{color:var(--ink-2);font-size:15.5px;line-height:2;margin:0 0 14px}
.pb-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--ink-3);font-size:12.5px;
  border-top:.5px solid var(--hairline);padding:12px 18px}
.pb-meta .i{width:15px;height:15px;vertical-align:-3px;margin-left:4px}
.pb-author{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.pb-av{width:26px;height:26px;border-radius:50%;background:var(--g,#0071E3);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.pb-body{margin-top:16px;display:grid;gap:16px}
.pb-p{font-size:15.5px;line-height:2.15;color:var(--ink);margin:0;text-align:justify;overflow-wrap:anywhere}
.pb-h2{font-size:19px;font-weight:800;margin:10px 0 0;line-height:1.7}
.pb-h3{font-size:16px;font-weight:700;margin:6px 0 0;color:var(--ink-2)}
.pb-h2 a,.pb-h3 a{color:inherit;text-decoration:none}
.pb-fig{margin:0}
.pb-fig img{width:100%;border-radius:16px;border:.5px solid var(--hairline);display:block}
.pb-fig figcaption{font-size:12.5px;color:var(--ink-3);margin-top:7px;text-align:center}
.pb-gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb-gal .pb-fig img{aspect-ratio:1/1;object-fit:cover}
.pb-vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:.5px solid var(--hairline);background:#0B1220}
.pb-vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pb-vid video{width:100%;height:100%;object-fit:contain;background:#000}
.pb-cap{font-size:12.5px;color:var(--ink-3);margin-top:7px;text-align:center}
.pb-aud{display:grid;gap:8px;padding:14px;border-radius:16px;border:.5px solid var(--hairline);
  background:color-mix(in oklab,var(--surface) 70%,#0071E3 4%)}
.pb-aud .pb-audrow{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.pb-aud .i{width:20px;height:20px;color:#0071E3}
.pb-aud audio{width:100%;height:38px}
.pb-q{margin:0;padding:16px 18px;border-right:3px solid #0071E3;border-radius:12px 4px 4px 12px;
  background:color-mix(in oklab,var(--surface) 80%,#0071E3 5%)}
.pb-q p{margin:0;font-size:16.5px;line-height:2.1;font-weight:600}
.pb-q cite{display:block;margin-top:8px;font-size:12.5px;color:var(--ink-3);font-style:normal}
.pb-list{margin:0;padding-right:20px;display:grid;gap:8px;font-size:15px;line-height:1.9}
.pb-list li::marker{color:#0071E3}
.pb-btn{display:flex;justify-content:center;padding:4px 0}
.pb-btn a{min-width:200px;justify-content:center}
.pb-box{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:14px;
  border:.5px solid color-mix(in oklab,var(--hairline) 70%,#0071E3 30%);
  background:color-mix(in oklab,var(--surface) 84%,#0071E3 6%)}
.pb-box .i{width:20px;height:20px;flex:none;color:#0071E3;margin-top:2px}
.pb-box p{margin:0;font-size:14px;line-height:1.95}
.pb-tog{border:.5px solid var(--hairline);border-radius:14px;background:var(--surface);overflow:hidden}
.pb-tog summary{cursor:pointer;padding:13px 15px;font-weight:700;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px}
.pb-tog summary::-webkit-details-marker{display:none}
.pb-tog summary .i{width:16px;height:16px;color:#0071E3;transition:transform .25s}
.pb-tog[open] summary .i{transform:rotate(90deg)}
.pb-tog .pb-togbody{padding:0 15px 13px;font-size:14.5px;line-height:2;color:var(--ink-2)}
.pb-hr{border:0;border-top:.5px dashed var(--hairline-2);margin:6px 0}
.pb-emb{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:.5px solid var(--hairline);background:var(--surface)}
.pb-emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* فهرست مطالب */
.pb-toc{padding:14px 16px;border-radius:16px;border:.5px solid var(--hairline);background:var(--surface)}
.pb-toc .pb-toch{font-size:13px;font-weight:800;color:var(--ink-3);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.pb-toc .pb-toch .i{width:15px;height:15px;color:#0071E3}
.pb-toc ol{margin:0;padding-right:18px;display:grid;gap:6px;font-size:13.5px}
.pb-toc a{color:var(--ink-2);text-decoration:none}
.pb-toc a:active{color:#0071E3}
/* گالری، جدول، فایل و لینک خودکار */
.pb-galwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb-galwrap .pb-fig{margin:0}
.pb-galwrap .pb-fig img{aspect-ratio:1/1;object-fit:cover}
@media (max-width:360px){.pb-galwrap{grid-template-columns:1fr}}
.pb-tblwrap{overflow:auto;border:.5px solid var(--hairline);border-radius:14px;background:var(--surface)}
.pb-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.pb-tbl th{background:color-mix(in oklab,var(--surface) 80%,#0071E3 7%);font-weight:700;text-align:right}
.pb-tbl th,.pb-tbl td{padding:9px 12px;border-bottom:.5px solid var(--hairline)}
.pb-tbl tr:last-child td{border-bottom:0}
.pb-file,.pb-bm{display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:15px;
  border:.5px solid var(--hairline);background:var(--surface);color:inherit;text-decoration:none}
.pb-file{border-style:dashed}
.pb-file .i{width:22px;height:22px;color:#0071E3;flex:none}
.pb-file b{display:block;font-size:14px}
.pb-file small,.pb-bm small{color:var(--ink-3);font-size:12px}
.pb-bmimg{width:64px;height:64px;border-radius:11px;flex:none;overflow:hidden;background:var(--g,linear-gradient(135deg,#1E6FD0,#0A3A82));display:grid;place-items:center;color:#fff}
.pb-bmimg img{width:100%;height:100%;object-fit:cover}
.pb-bm b{display:block;font-size:14px;line-height:1.7}
.pb-bmhost{display:block;color:#0071E3;font-size:11.5px;margin-top:2px}

/* پیوند رویداد و فرم */
.pb-linkrow{display:grid;gap:10px;margin-top:16px}
.pb-ev{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:.5px solid var(--hairline);background:var(--surface)}
.pb-ev .pb-evcov{width:74px;height:74px;border-radius:12px;flex:none;background:var(--g);overflow:hidden}
.pb-ev .pb-evcov img{width:100%;height:100%;object-fit:cover}
.pb-ev .pb-evtx{flex:1;min-width:0}
.pb-ev .pb-evtx b{display:block;font-size:14px;margin-bottom:3px}
.pb-ev .pb-evtx small{color:var(--ink-3);font-size:12px}
/* مطلبهای پیشنهادی */
.pb-rel{margin-top:26px}
.pb-rel .pb-relh{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.pb-rel .pb-relh .i{width:17px;height:17px;color:#0071E3}
.pb-relgrid{display:grid;gap:10px}
.pb-relcard{display:flex;gap:11px;align-items:center;padding:10px;border-radius:15px;border:.5px solid var(--hairline);background:var(--surface);text-decoration:none;color:inherit}
.pb-relcard .cov{width:56px;height:56px;border-radius:11px;flex:none;background:var(--g);overflow:hidden;position:relative}
.pb-relcard .cov img{width:100%;height:100%;object-fit:cover}
.pb-relcard b{display:block;font-size:13.5px;line-height:1.7}
.pb-relcard small{color:var(--ink-3);font-size:11.5px}
/* نوار کنش پایین */
.pb-act{display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.pb-ribbon{position:fixed;top:10px;left:10px;z-index:70}
@media (min-width:760px){
  .pb-col{max-width:680px;margin:0 auto}
  .pb-head h1{font-size:27px}
}
</style>
</head>

const faN=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const U=window.NORA_UI||{};
const QS=new URLSearchParams(location.search);
const id=QS.get('id')||location.hash.replace('#','');
const preview=QS.get('d')==='1';

/* ── مطلب ثابت را هم بلوکی می‌کنیم تا یک خواننده همه را بخواند ── */
function artToPost(a){
  const bs=[];
  (a.body||[]).forEach(x=>bs.push({ty:'p',x:x}));
  if(a.quote) bs.push({ty:'q',x:a.quote,by:a.tchr?(PEOPLE.find(p=>p.id===a.tchr)||{}).n:'سردبیر'});
  if((a.list||[]).length) bs.push({ty:'ol',x:a.list});
  const P={id:a.id, t:a.t, cat:a.cat, tags:a.tags||[], lead:a.lead||'',
    cover:{g:a.g||''}, author:a.tchr?(PEOPLE.find(p=>p.id===a.tchr)||{}).n:'تحریریهٔ نورا',
    blocks:bs, demo:1, club:!!a.club, pin:!!a.pin,
    views:a.views||'', min:a.min||1, endtags:a.tagsEnd||[]};
  return P;
}
function resolve(){
  const p=U.postById?U.postById(id):null;
  if(p){
    if(pend(p)||preview||p.pub) return {p:p, pend:!!p.pend};
    return null;
  }
  const a=ARTICLES.find(x=>x.id===id);
  return a?{p:artToPost(a), pend:false}:null;
}
const pend=p=>p.pub===0&&p.pend===1;   /* در صف تأیید */

/* ── میزبان رسانه از دل لینک ── */
function videoBits(src){
  const s=String(src||'').trim();
  let m=s.match(/aparat\.com\/v\/([A-Za-z0-9]+)/);
  if(m) return {host:'aparat', url:'https://www.aparat.com/video/video/embed/videohash/'+m[1]+'/vt/frame'};
  m=s.match(/aparat\.com\/video\/video\/embed\/videohash\/([A-Za-z0-9]+)/);
  if(m) return {host:'aparat', url:'https://www.aparat.com/video/video/embed/videohash/'+m[1]+'/vt/frame'};
  m=s.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if(m) return {host:'youtube', url:'https://www.youtube-nocookie.com/embed/'+m[1]};
  if(/\.(mp4|webm|ogg|mov)(\?|$)/i.test(s)) return {host:'file', url:s};
  return null;
}

function blockHTML(b,i){
  if(!b||!b.ty) return '';
  const cap=b.cap?`<figcaption class="pb-cap">${esc(b.cap)}</figcaption>`:'';
  const capD=b.cap?`<div class="pb-cap">${esc(b.cap)}</div>`:'';
  switch(b.ty){
    case 'p': return `<p class="pb-p">${esc(b.x)}</p>`;
    case 'h':{const tg=+b.lv===3?'h3':'h2', cls=+b.lv===3?'pb-h3':'pb-h2';
      return `<${tg} class="${cls}" id="psec${i}"><a href="#psec${i}">${esc(b.x)}</a></${tg}>`}
    case 'img':{
      const src=b.up||b.src||'';
      if(!src) return '';
      return `<figure class="pb-fig"><img src="${esc(src)}" alt="${esc(b.alt||b.cap||'')}" loading="lazy"/>${cap}</figure>`}
    case 'vid':{
      if(b.up) return `<figure class="pb-fig"><div class="pb-vid"><video controls playsinline preload="metadata" src="${esc(b.up)}"></video></div>${cap}</figure>`;
      const v=videoBits(b.src);
      if(!v) return '';
      if(v.host==='file') return `<figure class="pb-fig"><div class="pb-vid"><video controls playsinline preload="metadata" src="${esc(v.url)}"></video></div>${cap}</figure>`;
      return `<figure class="pb-fig"><div class="pb-vid"><iframe src="${esc(v.url)}" loading="lazy" allowfullscreen title="ویدیو" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>${cap}</figure>`}
    case 'aud':{
      const src=b.up||b.src;
      if(!src) return '';
      const nm=b.cap||'فایل صوتی';
      return `<div class="pb-aud"><div class="pb-audrow">${ico('i-headphone')}<span>${esc(nm)}</span></div>
        <audio controls preload="metadata" src="${esc(src)}"></audio></div>`}
    case 'q': return `<blockquote class="pb-q"><p>${esc(b.x)}</p>${b.by?`<cite>${esc(b.by)}</cite>`:''}</blockquote>`;
    case 'gal':{
      const imgs=(Array.isArray(b.x)?b.x:[]).filter(Boolean);
      if(!imgs.length) return '';
      return `<div class="pb-galwrap">${imgs.map(u=>`<figure class="pb-fig"><img src="${esc(u)}" alt="${esc(b.cap||'')}" loading="lazy"/></figure>`).join('')}</div>${capD}`}
    case 'file':{
      if(!b.src) return '';
      return `<a class="pb-file" href="${esc(b.src)}" target="_blank" rel="noopener" download>
        ${ico('i-download')}<span class="sp"><b>${esc(b.t||b.cap||'فایل')}</b><small>دریافت فایل</small></span></a>`}
    case 'bm':{
      if(!b.href) return '';
      const host=(function(){try{return new URL(b.href).hostname.replace(/^www\./,'')}catch(e){return ''}})();
      return `<a class="pb-bm" href="${esc(b.href)}" target="_blank" rel="noopener">
        <span class="pb-bmimg">${b.src?`<img src="${esc(b.src)}" alt="" loading="lazy"/>`:ico('i-link')}</span>
        <span class="sp"><b>${esc(b.t||host||'لینک')}</b>${b.x?`<small>${esc(b.x)}</small>`:''}
        ${host?`<span class="pb-bmhost">${esc(host)}</span>`:''}</span></a>`}
    case 'tbl':{
      const rows=(Array.isArray(b.x)?b.x:[]).filter(Boolean).map(r=>String(r).split('|').map(c=>c.trim()));
      if(!rows.length) return '';
      return `<div class="pb-tblwrap"><table class="pb-tbl">${rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>${capD}`}
    case 'ul': case 'ol':{
      const items=(Array.isArray(b.x)?b.x:[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('');
      return `<${b.ty} class="pb-list">${items}</${b.ty}>`}
    case 'btn':{
      if(!b.href) return '';
      const cls=b.kind==='quiet'?'btn quiet':'btn primary';
      return `<div class="pb-btn"><a class="${cls}" href="${esc(b.href)}" target="_blank" rel="noopener">${ico('i-link')}${esc(b.x||'بیشتر')}</a></div>`}
    case 'box': return `<div class="pb-box">${ico(b.ic||'i-info')}<p>${esc(b.x)}</p></div>`;
    case 'tog': return `<details class="pb-tog"><summary>${ico('i-chev-left')}${esc(b.t||'بیشتر بدانید')}</summary>
      <div class="pb-togbody">${esc(b.x)}</div></details>`;
    case 'hr': return '<hr class="pb-hr"/>';
    default: return '';
  }
}

function relCards(p){
  const pool=(U.postsFeed?U.postsFeed():[]).concat(ARTICLES.map(a=>({id:a.id,t:a.t,cat:a.cat,tags:a.tags||[],
    g:a.g,min:a.min,who:a.tchr?(PEOPLE.find(x=>x.id===a.tchr)||{}).n:'تحریریهٔ نورا'})));
  const score=x=>{if(String(x.id)===String(p.id)) return -1; let s=0;
    if(x.cat&&x.cat===p.cat) s+=2;
    (x.tags||[]).forEach(t=>{if((p.tags||[]).indexOf(t)>-1) s+=1});
    return s};
  return pool.map(x=>({x:x, s:score(x)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
}

function render(){
  const r=resolve();
  const page=$('#page');
  if(!r){
    page.innerHTML=`<div class="card stack" style="margin-top:18px;text-align:center;padding:26px">
      ${ico('i-article','width:34px;height:34px;color:var(--ink-3)')}
      <div class="title">این مطلب پیدا نشد</div>
      <p class="cap">شاید برداشته شده یا نشانی عوض است.</p>
      <a class="btn primary" href="home.html#articles">همهٔ مطلبها</a></div>`;
    document.title='نورا · مطلب پیدا نشد';
    return;
  }
  const p=r.p, isPend=r.pend, pv=preview;
  $('#pvRibbon').hidden=(!pv||p.demo)&&!isPend;
  if(isPend&&!pv) $('#pvRibbon').querySelector('.tag').textContent='در انتظار تأیید';
  const min=p.min||((U.postMin&&U.postMin(p))||1);
  const date=p.demo?'':((U.postDate&&U.postDate(p.at))||'');
  const views=p.demo?p.views:faN(+p.views||0);
  const ini=String(p.author||'ن').trim().slice(0,1);
  const heads=(p.blocks||[]).map((b,i)=>({b:b,i:i})).filter(x=>x.b&&x.b.ty==='h'&&x.b.x);
  const coverImg=p.cover&&p.cover.up;
  const EVROW=(N.EVENTS||[]).find(x=>String(x.id)===String(p.ev));
  const ev=p.ev?((U.pubEvents?U.pubEvents():[]).find(x=>String(x.id)===String(p.ev))
    ||(EVROW?{id:EVROW.id,t:EVROW.t,kind:EVROW.kind,when:EVROW.when,time:EVROW.time,
      g:EVROW.g||'',poster:EVROW.poster?('posters/'+EVROW.poster):''}:null)):null;
  const fm=p.fm&&U.formById?U.formById(p.fm):null;
  const fmHref=fm?(fm.ev?('form.html?ev='+encodeURIComponent(fm.ev)+(fm.need?'&kind='+encodeURIComponent(fm.need):''))
    :('form.html?fr='+encodeURIComponent(fm.id))):'';
  const rel=relCards(p);
  const endtags=p.endtags||[];
  page.innerHTML=`
  <article>
    <div class="pb-hero">
      <div class="pb-cover" style="--g:${esc(p.cover&&p.cover.g||'linear-gradient(135deg,#1E6FD0,#0A3A82)')}">
        ${coverImg?`<img src="${esc(coverImg)}" alt="${esc(p.t)}"/>`:''}
        <div class="kn"><span class="tagg tag-g">${esc(p.cat||'مطلب')}</span>
          ${p.club?'<span class="tagg tag-club">ویژهٔ باشگاه</span>':''}
          ${p.pin?'<span class="tagg tag-g">پین‌شده</span>':''}</div>
      </div>
      <div class="pb-head">
        <h1>${esc(p.t)}</h1>
        ${p.lead?`<p class="pb-lead">${esc(p.lead)}</p>`:''}
      </div>
      <div class="pb-meta">
        <span class="pb-author"><span class="pb-av">${esc(ini)}</span>${esc(p.author||'تحریریهٔ نورا')}</span>
        ${date?`<span>${ico('i-calendar')}${esc(date)}</span>`:''}
        <span>${ico('i-clock')}${faN(min)} دقیقه مطالعه</span>
        ${views?`<span>${ico('i-eye')}${esc(views)} بازدید</span>`:''}
      </div>
    </div>

    ${heads.length>=2?`<div class="pb-toc" style="margin-top:14px">
      <div class="pb-toch">${ico('i-list')}فهرست مطالب</div>
      <ol>${heads.map(h=>`<li><a href="#psec${h.i}">${esc(h.b.x)}</a></li>`).join('')}</ol>
    </div>`:''}

    <div class="pb-body">${(p.blocks||[]).map(blockHTML).join('')}</div>

    ${endtags.length?`<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:14px">${endtags.map(t=>`<span class="tagg tag-g">${esc(t)}</span>`).join('')}</div>`:''}

    ${(ev||fm)?`<div class="pb-linkrow">
      ${ev?`<a class="pb-ev" href="event.html?id=${encodeURIComponent(ev.id)}" style="text-decoration:none;color:inherit">
        <span class="pb-evcov" style="--g:${esc(ev.g||'')}">${ev.poster?`<img src="${esc(ev.poster)}" alt=""/>`:''}</span>
        <span class="pb-evtx"><b>${esc(ev.t)}</b><small>${esc(ev.kind||'')} · ${esc(ev.when||'')}${ev.time?' · '+esc(ev.time):''}</small></span>
        <span class="btn sm primary">${ico('i-calendar')} ثبت‌نام</span></a>`:''}
      ${fm&&fmHref?`<div class="pb-btn" style="justify-content:flex-start">
        <a class="btn primary" href="${fmHref}">${ico('i-doc')} ${esc(fm.name||'فرم پیوندشده')}</a></div>`:''}
    </div>`:''}

    <div class="pb-act">
      <button class="btn quiet" id="pbShare">${ico('i-share')} همرسانی</button>
      <button class="btn quiet" id="pbCopy">${ico('i-link')} رونوشت لینک</button>
    </div>

    ${rel.length?`<div class="pb-rel"><div class="pb-relh">${ico('i-article')}پیشنهاد برای خواندن</div>
      <div class="pb-relgrid">${rel.map(r2=>{const c=r2.x;
        return `<a class="pb-relcard" href="post.html?id=${encodeURIComponent(c.id)}">
        <span class="cov" style="--g:${esc(c.g||'')}">${c.cov?`<img src="${esc(c.cov)}" alt=""/>`:''}</span>
        <span class="sp"><b>${esc(c.t)}</b><small>${esc(c.cat||'مطلب')} · ${faN(c.min||1)} دقیقه${c.who?' · '+esc(c.who):''}</small></span>
        ${ico('i-chev-left')}</a>`}).join('')}</div></div>`:''}
  </article>`;
  document.title='نورا · '+p.t;

  /* کنشها: همرسانی و رونوشت */
  const url='https://lifeline1.ir/p/'+encodeURIComponent(p.id);
  const sh=$('#pbShare');
  if(sh) sh.onclick=()=>{ if(U.shareItem) U.shareItem({title:p.t, text:p.lead||p.t, url:url}); };
  const cp=$('#pbCopy');
  if(cp) cp.onclick=()=>{ if(U.copyText){U.copyText(url); if(U.toast) U.toast('لینک مطلب برداشته شد')} };
}

/* نوار پیشرفت خواندن */
addEventListener('scroll',()=>{
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  $('#rbar').style.width=(max>0?Math.min(100,Math.round(h.scrollTop/max*100)):0)+'%';
},{passive:true});

render();
if(!preview&&id&&U.postView) U.postView(id);
})();
</script>
</body>
</html>
