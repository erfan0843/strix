<style>
  html.atscroll .topbar{background:color-mix(in oklab,var(--surface) 60%,transparent);
    backdrop-filter:blur(22px) saturate(1.7);box-shadow:0 1px 0 var(--hairline),0 8px 26px rgba(10,30,60,.07)}
  .evHero{border-radius:var(--r-xl);padding:18px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#0A56B8,#0B2447)}
  .evHero h1{margin:0 0 6px;font-size:21px;letter-spacing:-.5px}
  .evHero p{margin:0;font-size:13px;color:rgba(255,255,255,.9);line-height:1.8;max-width:44ch}
  .hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;position:relative;z-index:1}
  .hstats .s{background:rgba(255,255,255,.14);border:.5px solid rgba(255,255,255,.2);border-radius:var(--r-md);padding:8px 6px;text-align:center}
  .hstats .s b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .hstats .s span{font-size:10.5px;color:rgba(255,255,255,.86)}
  @media (max-width:420px){.hstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .monthsw{display:flex;gap:7px;margin-bottom:10px}
  .monthsw button{-webkit-appearance:none;appearance:none;font:inherit;cursor:pointer;padding:7px 13px;border-radius:99px;
    border:.5px solid var(--hairline);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600}
  .monthsw button.on{background:var(--brand);border-color:transparent;color:#fff}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .calgrid .wd{text-align:center;font-size:10.5px;color:var(--ink-4);padding-bottom:2px}
  .cel{position:relative;-webkit-appearance:none;appearance:none;font:inherit;cursor:pointer;aspect-ratio:1/1;border-radius:13px;
    border:.5px solid var(--hairline);background:var(--surface);color:var(--ink);display:grid;place-items:center;
    font-size:13px;font-variant-numeric:tabular-nums;transition:transform var(--t-fast) var(--spring),border-color var(--t-fast) var(--ease)}
  .cel.blank{border:0;background:none;cursor:default}
  .cel:hover:not(.blank){border-color:color-mix(in oklab,var(--brand) 45%,transparent)}
  .cel:active:not(.blank){transform:scale(.94)}
  .cel.has{background:var(--brand-tint);border-color:transparent;color:var(--brand-ink);font-weight:700}
  .cel.today{border-color:var(--brand);border-width:1.5px}
  .cel.sel{background:var(--brand);color:#fff;border-color:transparent}
  .cel .dots{position:absolute;bottom:5px;display:flex;gap:2.5px;justify-content:center}
  .cel .dots i{width:4.5px;height:4.5px;border-radius:50%;background:currentColor;opacity:.75}
  .cel.sel .dots i{background:#fff}
  .dayhd{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
  .dayhd b{font-size:14px}
  .dayhd .sp{flex:1}
  .catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  @media (min-width:560px){.catgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .cattile{-webkit-appearance:none;appearance:none;font:inherit;color:inherit;cursor:pointer;text-align:start;display:grid;gap:5px;
    padding:13px;border-radius:var(--r-lg);border:.5px solid var(--hairline);background:var(--surface)}
  .cattile:hover{border-color:color-mix(in oklab,var(--brand) 42%,transparent);transform:translateY(-1.5px)}
  .cattile .ci{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand-ink)}
  .cattile .ci .i{width:21px;height:21px}
  .cattile b{font-size:13px}
  .cattile small{font-size:10.5px;color:var(--ink-3)}
  @media (min-width:720px){.sheet{inset-inline:auto;inset-inline-start:50%;width:520px;transform:translate(-50%,105%);border-end-start-radius:26px;border-end-end-radius:26px}
    .sheet.on{transform:translate(-50%,0)}}
  .fcrow{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px}

/* ── جعبهٔ «رویداد من»: همهٔ جزئیات همین رویداد، یک‌جا و بی‌قاطی‌شدن ── */
.mybox{margin:0 0 14px;border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(158deg,rgba(0,113,227,.13),rgba(0,113,227,.05));
  border:.5px solid rgba(0,113,227,.18);box-shadow:none}
.mybox .mbh{display:flex;align-items:center;gap:9px;padding:13px 14px 8px}
.mybox .mbh .i{width:20px;height:20px;color:var(--brand-ink)}
.mybox .mbh b{font-size:13.5px}
.mybox .mbh .cap{margin-inline-start:auto}
.mycd{display:flex;align-items:center;gap:7px;padding:0 14px 10px;font-size:12px;color:var(--ink-2)}
.mycd .n{font-size:18px;font-weight:800;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.mbtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:0 11px 12px}
.mb3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:0 11px 12px}
.mbt{display:grid;gap:3px;padding:11px;border-radius:14px;border:.5px solid rgba(0,113,227,.14);
  background:rgba(255,255,255,.66);text-align:start;font:inherit;cursor:pointer;color:var(--ink)}
.mbt:hover{background:rgba(255,255,255,.95)}
.mbt .i{width:17px;height:17px;color:var(--brand-ink)}
.mbt b{font-size:12.5px;font-weight:700}
.mbt small{font-size:10.5px;color:var(--ink-3);line-height:1.6}
:root[data-theme="dark"] .mybox{background:linear-gradient(158deg,rgba(78,161,255,.18),rgba(78,161,255,.06));border-color:rgba(78,161,255,.24)}
:root[data-theme="dark"] .mbt{background:rgba(255,255,255,.08);border-color:rgba(78,161,255,.20)}
:root[data-theme="dark"] .mbt:hover{background:rgba(255,255,255,.14)}
@media (max-width:400px){.mbtiles,.mb3{grid-template-columns:1fr 1fr}}
</style>

<script>
/* ══════════════════════════════════════════════════════════════════════
   صفحهٔ اختصاصی رویداد و بستهٔ رسانه
   ──────────────────────────────────────────────────────────────────────
   از ورقهٔ کلیات این‌جا می‌آییم: جزئیات کامل، لینک ثبت‌نام، رسانه‌ها،
   تقویم، یادآوری و پشتیبانی، همه در یک صفحهٔ آرام و بی‌شلوغی.
   ══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
const N=window.NORA||{};
const {EVENTS=[],PAST=[],PEOPLE=[],MEDIA_KINDS={}}=N;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const P=id=>PEOPLE.find(p=>p.id===id)||{n:'—',ini:'؟',r:'',g:''};
/* اعلان‌های زودهنگام: render() همین پایین‌تر صدا زده می‌شود و این‌ها را لازم دارد */
const ico=(n,st)=>`<svg class="i"${st?` style="${st}"`:''} aria-hidden="true"><use href="#${n}"/></svg>`;
const cdClock={t:0};
const id=new URLSearchParams(location.search).get('id')||location.hash.replace('#','')||'';
const E=EVENTS.find(x=>x.id===id), H=PAST.find(x=>x.id===id), e=E||H;

if(!e){
  $('#page').innerHTML=`<div class="empty" style="margin-top:40px"><svg class="i"><use href="#i-search"/></svg>
    <p>این رویداد را پیدا نکردم. از فهرست رویدادها یکی را انتخاب کن.</p>
    <a class="btn primary" href="events.html#list" style="text-decoration:none;margin-top:12px">رفتن به فهرست رویدادها</a></div>`;
} else { render() }

function room(){
  const m=e.mode||'';
  return m.indexOf('حضوری')<0?'آنلاین':(m==='حضوری و آنلاین'?'حضوری و آنلاین':'حضوری');
}
function remindOn(){try{return !!JSON.parse(localStorage.getItem('nora-home-remind')||'null')}catch(err){return false}}
function setRemind(v){try{localStorage.setItem('nora-home-remind',JSON.stringify(v))}catch(err){}}

/* مدل‌های پرداخت همین رویداد؛ مدیر و سازندهٔ رویداد انتخاب کرده‌اند */
function payModelsTxt(id){
  const A=(window.NORA&&window.NORA.ACCOUNT&&window.NORA.ACCOUNT.pay)||{};
  const keys=(A.eventModels||{})[id]||A.defaultModels||[];
  const names=keys.map(k=>((A.methods||[]).find(m=>m.k===k)||{}).n||k);
  return names.join(' · ')||'همان مدل‌های پیش‌فرض';
}

/* ── «رویداد من»: فقط برای رویدادی که کاربر ثبت‌نام یا تهیه کرده ──────
   همهٔ جزئیات همین رویداد این‌جاست: شمارش تا برگزاری، بلیت، گواهی،
   رسانه و ضبط؛ هیچ چیز از رویدادهای دیگر قاطی نمی‌شود. */
function signedIn(){ try{ return !!JSON.parse(localStorage.getItem('nora-home-user')||'null') }catch(e){ return false } }
function myIds(){ const M=(N.ACCOUNT&&N.ACCOUNT.myEvents)||{}; return [].concat(M.up||[],M.past||[]) }
function isMine(e){ return !!e&&signedIn()&&myIds().indexOf(e.id)>-1 }
function cdText(e){
  const days=+String(e.dn||'').replace(/\D/g,'')||0;
  const total=((days*24+7)*60+37)*60*1000;
  const passed=cdClock.t0?Date.now()-cdClock.t0:0;
  let s=Math.max(0,Math.floor((total-passed)/1000));
  const d=Math.floor(s/86400); s-=d*86400;
  const h=Math.floor(s/3600); s-=h*3600;
  const m=Math.floor(s/60), sec=s-m*60;
  return `${faN(d)} روز و ${faN(h)} ساعت و ${faN(m)} دقیقه`+(sec>=0?` و ${faN(sec)} ثانیه`:'');
}
function myBox(e,past){
  const M=(N.ACCOUNT&&N.ACCOUNT.myEvents)||{}, T=M.ticket||{}, CT=M.certTxt||{}, MD=M.media||{}, RC=M.rec||{}, AT=M.att||{}, RV=M.review||{};
  const tiles=past?[
      [CT.n||'گواهینامه', CT.d||'', `data-my-cert="${esc(e.id)}"`, 'i-medal'],
      [MD.n||'رسانه‌های رویداد', MD.d||'', `data-my-media="${esc(e.id)}"`, 'i-image'],
      [RC.n||'ضبط‌شده', RC.d||'', `data-my-rec="${esc(e.id)}"`, 'i-play'],
      [AT.n||'کارنامهٔ حضور', AT.d||'', `data-my-att="${esc(e.id)}"`, 'i-check']]
    :[[T.n||'کارت ورود و بلیت', T.d||'', `data-my-ticket="${esc(e.id)}"`, 'i-ticket'],
      [T.dl||'دانلود بلیت', 'فایل بلیت همین رویداد', `data-my-ticket-dl="${esc(e.id)}"`, 'i-download'],
      [MD.n||'رسانه‌های رویداد', MD.d||'', `data-my-media="${esc(e.id)}"`, 'i-image'],
      [AT.n||'کارنامهٔ حضور', AT.d||'', `data-my-att="${esc(e.id)}"`, 'i-check'],
      [RV.n||'نظر و امتیاز من', RV.d||'', `data-my-review="${esc(e.id)}"`, 'i-star']];
  return `<div class="mybox anim">
    <div class="mbh">${ico('i-check')}<b>رویداد من</b>
      <span class="cap">${esc(M.inEvent||'همهٔ جزئیات همین رویداد این‌جاست.')}</span></div>
    ${past?'':`<div class="mycd" id="myCd">${ico('i-clock')}<span>تا برگزاری:</span>
      <span class="n" id="myCdN">${cdText(e)}</span></div>`}
    <div class="${tiles.length===3?'mb3':'mbtiles'}">
      ${tiles.map(t=>`<button class="mbt" type="button" ${t[2]}>
        ${ico(t[3])}<b>${esc(t[0])}</b><small>${esc(t[1])}</small></button>`).join('')}

function price2(n){return n?window.rialTxt?rialTxt(n):String(n)+' ریال':'رایگان'}

function renderMedia(){
  const box=$('#mlist'); if(!box) return;
  const K=[{k:'all',n:'همه'},{k:'video',n:'ویدیو'},{k:'audio',n:'صدا'},{k:'pdf',n:'فایل'},{k:'slide',n:'اسلاید'}];
  const cur=renderMedia.f||'all';
  $('#mfilter').innerHTML=K.map(x=>`<button class="chip ${cur===x.k?'on':''}" data-mk="${x.k}">${x.n}</button>`).join('');
  box.innerHTML=NORA_UI?NORA_UI.mediaList(e,{filter:cur}):'';
  /* رسانه‌ها رو‌به‌روی چشم، با نوار پیشرفت */
  const ownall=NORA_UI&&NORA_UI.hasLib(e.id);
  const tiles=(e.media||[]).filter(m=>cur==='all'||m.k===cur).map(m=>{
    const kd=MEDIA_KINDS[m.k]||{n:'رسانه',i:'i-play'};
    const open=!m.p||ownall||(NORA_UI&&NORA_UI.hasLib(m.id));
    return `<div class="stack tight" style="margin-bottom:10px">
      <div class="cap">${kd.n}</div>
      <button class="mediatile ${open?'':'locked'}" data-uimedia="${esc(e.id)}:${esc(m.id)}">
        <span class="mimg" style="--g:${esc(e.g||'')}">
          ${e.poster?`<img src="${esc(e.poster)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5"/>`:''}
          <svg class="i"><use href="#${kd.i}"/></svg>
          ${open?'':`<span class="mlock"><svg class="i" style="width:14px;height:14px"><use href="#i-lock"/></svg></span>`}
        </span>
        <span class="mb"><b>${esc(m.t)}</b><small>${esc(m.d)} · ${open?'باز است':price2(m.p)}</small></span>
      </button></div>`}).join('');
  box.innerHTML+=`<div class="sec-hd" style="margin-top:14px"><span class="fw">تماشا و دانلود</span><span class="sp"></span>
      <span class="cap">روی هر قطعه بزن</span></div><div class="mediagrid">${tiles}</div>`;
}

  const firstFree=past&&(e.media||[]).find(m=>!m.p||(NORA_UI&&NORA_UI.hasLib(m.id)));
  const preOn=!past&&NORA_UI&&NORA_UI.isPre&&NORA_UI.isPre(e.id);
  const preNeed=!past&&(e.pre||preOn);
  $('#ctabar').hidden=false;
  $('#ctaIn').innerHTML=`
    <span><b style="font-size:14px">${past?(e.price?price2(e.price):'رایگان'):(e.price?price2(e.price):'رایگان')}</b>
      <div class="cap">${past?(e.cert?'با گواهینامه':'بدون گواهی'):(e.sess>1?faN(e.sess)+' جلسه':(preNeed?'ثبت‌نام باز نشده':(full?'لیست انتظار':'ظرفیت باز')))}</div></span>

          : (full?`<button class="btn primary" data-waitlist><svg class="i"><use href="#i-clock"/></svg> لیست انتظار</button>`
             :`<a class="btn primary" id="reg" href="form.html?ev=${esc(e.id)}"><svg class="i"><use href="#i-pen"/></svg> ثبت‌نام${free?' · رایگان':''}</a>`))}

/* ── کنش‌ها ── */
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.closest('[data-back]')){ if(history.length>1) history.back(); else location.href='events.html'; return }
  const sh=t.closest('[data-share-this]'); if(sh){shareNow(); return}
  /* جزئیات «رویداد من»: هر کنش، فقط مالِ همین رویداد */
  const mt=t.closest('[data-my-ticket]'); if(mt){toast('کارت ورود همین رویداد آماده است؛ بارکد در ورودی خوانده می‌شود'); return}
  const mb=t.closest('[data-my-ticket-dl]'); if(mb){toast('بلیت همین رویداد دانلود شد'); return}
  const mc=t.closest('[data-my-cert]'); if(mc){toast(e.cert===false?'این رویداد گواهی ندارد':'گواهینامهٔ همین رویداد آماده است؛ بعد از تأیید سرپرست دانلود می‌شود'); return}
  const mm=t.closest('[data-my-media]'); if(mm){const host=$('#mlist'); if(host) host.scrollIntoView({behavior:'smooth',block:'start'}); toast('رسانه‌های همین رویداد'); return}
  const mr=t.closest('[data-my-rec]'); if(mr){toast('ضبط جلسه‌های همین رویداد، همین‌جا در رسانه‌ها'); return}
  const ma=t.closest('[data-my-att]'); if(ma){toast('کارنامهٔ حضور همین رویداد: جلسه‌به‌جلسه'); return}
  const mv=t.closest('[data-my-review]'); if(mv){toast('نظر و امتیازت برای همین رویداد ثبت شد'); return}
  const pin=t.closest('[data-pin-this]'); if(pin){pinNow(); return}
  const mk=t.closest('[data-mk]'); if(mk){renderMedia.f=mk.dataset.mk; renderMedia(); return}
  const bb=t.closest('[data-buy-bundle]'); if(bb){NORA_UI.buySheet(e.id,null); return}
  const cr=t.closest('[data-cert-req]'); if(cr){toast('درخواست گواهینامه ثبت شد؛ در انتظار تأیید سرپرست'); return}
  const cr2=t.closest('[data-copy-reg]'); if(cr2){NORA_UI.copyText('https://lifeline1.ir/reg/'+String(e.id).toLowerCase()); return}
  const rm=t.closest('[data-remind-here]'); if(rm){setRemind(!remindOn()); render(); toast(remindOn()?'یادآوری روشن شد؛ یک روز قبل و ۱۵ دقیقه قبل خبر می‌دهیم':'یادآوری خاموش شد'); return}
  const tl=t.closest('[data-testlink]'); if(tl){toast('اتصال تست شد؛ تصویر و صدا روان است'); return}
  const wl=t.closest('[data-waitlist]'); if(wl){toast('در لیست انتظار ثبت شدی؛ اگر جا خالی شد خبر می‌دهیم'); return}
  const gt=t.closest('[data-goto]'); if(gt){location.href='event.html?id='+gt.dataset.goto; return}
});

function pinNow(){
  const k=(H?'pa':'ev')+':'+e.id;
  let a=[]; try{a=JSON.parse(localStorage.getItem('nora-home-pins')||'[]')}catch(err){a=[]}
  const on=a.includes(k); a=on?a.filter(x=>x!==k):a.concat(k);
  try{localStorage.setItem('nora-home-pins',JSON.stringify(a))}catch(err){}
  toast(on?'از سنجاق درآمد':'سنجاق شد');
}
function toast(m){
  let el=$('#toast');
  if(!el){el=document.createElement('div'); el.className='toast'; el.id='toast'; el.setAttribute('role','status'); document.body.appendChild(el)}
  el.textContent=m; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2400);
}
