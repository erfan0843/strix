<script>/* تم پیش از نخستین رنگ‌آمیزی */
(function(){try{var v=localStorage.getItem('nora-theme');
if(v!=='dark'&&v!=='light')v=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';
var r=document.documentElement;r.dataset.theme=v;r.style.colorScheme=v;
var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',v==='dark'?'#1B211E':'#F5F3EE');}catch(e){}})();</script>

<body class="loginpage">

  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.6 5.4 6.4v5c0 4.6 2.8 7.6 6.6 9 3.8-1.4 6.6-4.4 6.6-9v-5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="m9.4 12.2 1.9 1.9 3.4-3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.5v2.1M12 19.4v2.1M2.5 12h2.1M19.4 12h2.1M5.3 5.3l1.5 1.5m10.4 10.4 1.5 1.5m0-13.4-1.5 1.5M6.8 17.2l-1.5 1.5"/></g></symbol>

      <span class="tsw-trk" aria-hidden="true">
        <span class="tsw-ico tsw-sun"><svg class="i"><use href="#i-sun"/></svg></span>
        <span class="tsw-ico tsw-moon"><svg class="i"><use href="#i-moon"/></svg></span>

      </span>

  <main class="lwrap">

    </section>
  </main>
