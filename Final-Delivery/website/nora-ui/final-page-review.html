<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"/>
<title>تکمیل درخواست | پیش‌نمایش نورا</title>
<link rel="preload" href="fonts/Vazirmatn-UI-FD-Regular.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="fonts/Estedad-Variable.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="glass.css?v=99">
<style>
  body{min-height:100vh;background:radial-gradient(ellipse at 50% 0,#e5f4ec 0,transparent 48%),#f5f7f6}
  .final-page{width:min(560px,calc(100% - 28px));margin:0 auto;padding:clamp(28px,8vh,76px) 0 calc(34px + var(--safe-b,0px));direction:rtl}
  .completion-hero{position:relative;isolation:isolate;display:grid;justify-items:center;gap:15px;min-height:230px;padding:34px 22px 31px;overflow:hidden;border:1px solid #dcebe1;border-radius:27px;background:linear-gradient(145deg,#fbfffc 0%,#eff8f2 55%,#e8f4ec 100%);box-shadow:0 18px 44px rgba(35,89,61,.09),inset 0 1px 0 rgba(255,255,255,.95);text-align:center}
  .completion-hero:before,.completion-hero:after{position:absolute;z-index:-1;content:"";pointer-events:none;border-radius:50%}
  .completion-hero:before{width:250px;height:250px;inset-block-start:-157px;inset-inline-start:-78px;border:1px solid rgba(76,151,103,.12);box-shadow:0 0 0 22px rgba(76,151,103,.035),0 0 0 48px rgba(76,151,103,.025)}
  .completion-hero:after{width:190px;height:190px;inset-block-end:-136px;inset-inline-end:-55px;background:radial-gradient(circle,rgba(98,169,122,.13),rgba(98,169,122,0) 70%)}
  .completion-hero.is-warn{border-color:#efe3ca;background:linear-gradient(145deg,#fffefa 0%,#fffaf0 55%,#f8f0df 100%);box-shadow:0 18px 44px rgba(129,98,42,.08),inset 0 1px 0 rgba(255,255,255,.95)}
  .completion-mark{position:relative;display:grid;place-items:center;width:82px;height:82px;border:1px solid #c9e1d1;border-radius:50%;background:linear-gradient(145deg,#f6fff8,#e5f4ea);box-shadow:0 10px 24px rgba(39,112,68,.12),inset 0 0 0 7px rgba(255,255,255,.68);color:#28734e}
  .completion-mark:before{position:absolute;inset:-7px;content:"";border:1px solid rgba(67,143,91,.15);border-radius:50%}
  .completion-mark .i{width:35px;height:35px;stroke-width:2.5}
  .completion-hero.is-warn .completion-mark{border-color:#ead9b6;background:linear-gradient(145deg,#fffdf5,#f7edd8);color:#98702d;box-shadow:0 10px 24px rgba(129,98,42,.1),inset 0 0 0 7px rgba(255,255,255,.7)}
  .completion-hero.is-warn .completion-mark:before{border-color:rgba(152,112,45,.16)}
  .completion-copy{max-width:100%;min-width:0}
  .completion-copy h1{margin:0;color:#193c2c;font-family:'Estedad',var(--f);font-size:clamp(30px,7vw,38px);font-weight:850;line-height:1.35;letter-spacing:-.5px}
  .completion-hero.is-warn .completion-copy h1{color:#59451f}
  .completion-status{max-width:430px;margin:8px auto 0;color:#6b552c;font-size:13px;font-weight:650;line-height:1.85;white-space:pre-line;overflow-wrap:anywhere}
  .completion-status[hidden]{display:none!important}
  .ticket-image-frame{width:100%;aspect-ratio:1200/656;margin:19px 0 0;overflow:hidden;border:1px solid #dce4df;border-radius:16px;background:#edf0f2;box-shadow:0 10px 24px rgba(26,48,35,.08)}
  .ticket-image-frame[hidden]{display:none!important}
  .ticket-image{display:block;width:100%;height:100%;object-fit:contain}
  .download-cta{position:relative;display:flex;align-items:center;gap:13px;width:100%;min-height:68px;margin:13px auto 0;padding:11px 15px;border:1px solid #1c3564;border-radius:16px;background:linear-gradient(105deg,#213b6d,#294a80);box-shadow:0 11px 24px rgba(27,52,98,.17),inset 0 1px 0 rgba(255,255,255,.12);color:#fff;text-decoration:none;transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
  .download-cta:hover{transform:translateY(-2px);background:linear-gradient(105deg,#294a80,#34568f);box-shadow:0 15px 28px rgba(27,52,98,.2)}
  .download-cta:active{transform:scale(.995)}
  .download-cta:focus-visible,.final-link:focus-visible{outline:3px solid #bb914b;outline-offset:3px}
  .download-cta[hidden]{display:none!important}
  .download-icon{display:grid;place-items:center;flex:0 0 43px;width:43px;height:43px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:rgba(255,255,255,.12);color:#fff}
  .download-icon .i{width:23px;height:23px}
  .download-copy{display:grid;gap:2px;min-width:0;flex:1}
  .download-copy strong{font-family:'Estedad',var(--f);font-size:16px;font-weight:800;line-height:1.45}
  .download-copy small{color:rgba(255,255,255,.8);font-size:10px;line-height:1.55}
  .download-arrow{display:grid;place-items:center;flex:0 0 29px;width:29px;height:29px;color:rgba(255,255,255,.86)}
  .download-arrow .i{width:18px;height:18px}
  .completion-message{margin:18px 0 0;padding:14px 16px;border:1px solid #e1e8e3;border-inline-start:3px solid #6da77b;border-radius:13px;background:rgba(255,255,255,.9);box-shadow:0 7px 20px rgba(35,61,45,.045);color:#47564b;font-size:13px;line-height:1.9;white-space:pre-line;overflow-wrap:anywhere}
  .completion-message[hidden]{display:none!important}
  .final-links{margin:19px 0 0;text-align:center}
  .final-links[hidden],.final-links-heading[hidden]{display:none!important}
  .final-links-heading{margin:0 0 10px;color:#66746a;font-size:12px;font-weight:750;line-height:1.6}
  .final-links-list{display:grid;grid-template-columns:1fr;gap:9px}
  .final-link{display:flex;align-items:center;gap:11px;width:100%;min-height:55px;padding:9px 13px;border:1px solid #dbe6de;border-radius:14px;background:linear-gradient(110deg,#fff,#f7fbf8);box-shadow:0 5px 14px rgba(38,66,47,.045);color:#34513e;font-size:13px;font-weight:750;line-height:1.55;text-align:start;text-decoration:none;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
  .final-link:after{display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;margin-inline-start:auto;border:1px solid #e3ebe5;border-radius:10px;background:#f5f8f5;color:#718578;font-size:14px;font-weight:800;line-height:1;content:'↗'}
  .final-link:hover{transform:translateY(-1px);border-color:#bfd2c4;background:#fff;box-shadow:0 8px 18px rgba(38,66,47,.085)}
  .final-link-mark{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:11px;background:#eef3ef;color:#42644c;font-size:10px;font-weight:850;line-height:1;direction:ltr}
  .final-link.is-social .final-link-mark{background:#e8f4ec;color:#286746}
  @media(max-width:520px){
    .final-page{width:calc(100% - 26px);padding-top:25px}
    .completion-hero{gap:13px;min-height:205px;padding:27px 16px 25px;border-radius:23px}
    .completion-mark{width:72px;height:72px}
    .completion-mark .i{width:31px;height:31px}
    .completion-copy h1{font-size:31px}
    .completion-status{font-size:12px}
    .ticket-image-frame{margin-top:14px;border-radius:13px}
    .download-cta{min-height:63px;margin-top:11px;padding:9px 11px;border-radius:14px}
    .download-icon{flex-basis:39px;width:39px;height:39px;border-radius:11px}
    .download-copy strong{font-size:15px}
    .completion-message{margin-top:14px;padding:12px 13px;font-size:12px}
    .final-links{margin-top:15px}
    .final-link{min-height:52px;padding:8px 11px}
  }
  @media(max-width:350px){.download-copy small{font-size:9px}.final-link{font-size:12px}}
  .final-home{margin:18px 0 0;text-align:center}
  .final-home-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 18px;border:1px solid #dbe6de;border-radius:14px;background:#fff;color:#34513e;font-size:13px;font-weight:750;text-decoration:none}
  .final-home-link:focus-visible{outline:3px solid #7fb39a;outline-offset:2px}
  @media(prefers-reduced-motion:reduce){.download-cta,.final-link{transition:none}}
</style>
<meta name="description" content="پیش‌نمایش صفحهٔ تکمیل درخواست نورا؛ این صفحه نتیجهٔ تراکنش یا پرداخت را تأیید نمی‌کند."/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="alternate icon" href="/favicon.ico" sizes="any"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
</head>
<body>
<main class="final-page" aria-label="پایان فرم">
  <section class="completion-hero" id="completionHero" aria-labelledby="endTitle">
    <span class="completion-mark" aria-hidden="true"><svg class="i"><use href="icons.svg#i-check"/></svg></span>
    <div class="completion-copy">
      <h1 id="endTitle">تکمیل شد!</h1>
      <p class="completion-status" id="statusMessage" role="status" hidden></p>
    </div>
  </section>

  <figure class="ticket-image-frame" id="ticketImageFrame" aria-label="تصویر بلیت">
    <img class="ticket-image" width="1200" height="656" loading="eager" decoding="async" data-ticket-field="ticket_image" data-ticket-image-endpoint="/api/public/forms/{form_id}/ticket-image" data-ticket-image-fields="event_title event_date event_time participant_name ticket_type serial qr" alt="تصویر بلیت رویداد">
  </figure>

  <a class="download-cta" id="ticketDelivery" href="#" hidden target="_blank" rel="noopener noreferrer" aria-label="دانلود بلیت">
    <span class="download-icon" aria-hidden="true"><svg class="i"><use href="icons.svg#i-download"/></svg></span>
    <span class="download-copy"><strong>دانلود بلیت</strong><small>دریافت بلیت در بله</small></span>
    <span class="download-arrow" aria-hidden="true"><svg class="i"><use href="icons.svg#i-arrow-left"/></svg></span>
  </a>

  <p class="completion-message" id="endText" data-form-setting="endText" data-form-output="endText">از اینکه این فرم را تکمیل کردی، سپاسگزاریم.</p>
  <p class="final-home"><a class="final-home-link" href="home.html">بازگشت به خانهٔ نورا</a></p>
  <nav class="final-links" id="endLinks" data-form-output="links" aria-label="پیوندهای پایانی" hidden>
    <h2 class="final-links-heading" id="endLinksHeading" hidden>پیوندها و شبکه‌های اجتماعی</h2>
    <div class="final-links-list" id="endLinksList"></div>
  </nav>
</main>
<script>
(()=>{
  const params=new URLSearchParams(location.search),formId=params.get('fid')||'';
  const DEFAULT_END_TEXT='از اینکه این فرم را تکمیل کردی، سپاسگزاریم.';
  const LEGACY_END_TEXT='پاسخ نمونه فقط در همین مرورگر ذخیره شد؛ رسید، نتیجهٔ بررسی یا اعلانی ارسال نمی‌شود.';
  const fallback={id:'sample',model:'registration',need:'reg',endText:DEFAULT_END_TEXT,receiptReviewRequired:false,links:[]};
  let saved=null,handoff=null;
  if(formId){
    try{
      const raw=sessionStorage.getItem('nora-final-page-handoff:'+formId),parsed=raw?JSON.parse(raw):null;
      if(parsed&&String(parsed.formId)===formId&&parsed.form&&String(parsed.form.id)===formId)handoff=parsed;
    }catch(error){handoff=null}
    if(!handoff){
      try{
        const forms=JSON.parse(localStorage.getItem('nora-forms')||'[]');
        if(Array.isArray(forms))saved=forms.find(row=>row&&String(row.id)===formId)||null;
      }catch(error){saved=null}
    }
  }
  const formSource=handoff&&handoff.form?handoff.form:saved;
  const formSettings=formSource&&formSource.settings&&typeof formSource.settings==='object'?formSource.settings:{};
  const form=formSource?Object.assign({},formSettings,formSource):fallback;
  if(Array.isArray(formSettings.links))form.links=formSettings.links;
  if(typeof formSettings.endText==='string')form.endText=formSettings.endText;
  if(formSettings.receiptReviewRequired!=null)form.receiptReviewRequired=formSettings.receiptReviewRequired;
  const response=handoff&&handoff.response&&typeof handoff.response==='object'?handoff.response:null;
  const previewMode=params.get('preview')==='1'||!!(response&&response.status==='preview');
  const text=(value,limit=1500)=>typeof value==='string'?value.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,'').trim().slice(0,limit):'';
  const isRegistration=form.model==='registration'||(!form.model&&form.need==='reg');
  const state=String(response&&response.status||params.get('status')||(previewMode?'preview':'unavailable'));
  const paymentMethod=String(response&&response.paymentMethod||''),paymentStatus=String(response&&response.paymentStatus||'');
  const waiting=isRegistration&&state==='waitlisted';
  const receiptPending=isRegistration&&form.receiptReviewRequired===true&&state==='accepted'
    &&paymentMethod!=='bale_wallet'&&paymentStatus!=='paid_manual';
  const paymentApproved=!paymentMethod||paymentMethod==='bale_wallet'&&paymentStatus==='paid'
    ||paymentMethod==='card_transfer'&&paymentStatus==='paid_manual';
  const unavailable=!response&&!previewMode;
  const accepted=state==='accepted'&&!waiting&&!receiptPending&&!previewMode&&!unavailable&&paymentApproved;
  const safeBaleDelivery=value=>{
    const raw=text(value,180);if(!raw)return '';
    try{
      const url=new URL(raw),start=url.searchParams.get('start');
      if(url.protocol!=='https:'||url.hostname!=='ble.ir'||url.port||url.username||url.password||url.hash
          ||url.pathname[0]!=='/'||! /^[A-Za-z0-9_]{3,64}$/.test(url.pathname.slice(1))
          ||[...url.searchParams.keys()].length!==1||!/^ft_[A-Za-z0-9_-]{48}$/.test(start||''))return '';
      return url.href;
    }catch(error){return ''}
  };
  const deliveryUrl=accepted&&response&&safeBaleDelivery(response.ticketDeliveryUrl);
  const hero=document.getElementById('completionHero'),title=document.getElementById('endTitle');
  const statusNode=document.getElementById('statusMessage'),icon=hero&&hero.querySelector('use');
  const statusCopy=previewMode?'این فقط پیش‌نمایش محلی است؛ پاسخ یا پرداخت واقعی انجام نشده است.':
    unavailable?'اطلاعات ثبت‌نام در دسترس نیست؛ از پیوند فرم وارد شو.':
    accepted&&!deliveryUrl?'ثبت‌نام تکمیل شد؛ پیوند بلیت هنوز آماده نیست.':
    response&&state==='accepted'&&!accepted?'پاسخت ثبت شد؛ هنوز امکان نمایش بلیت وجود ندارد.':
    response?'پاسخت ثبت شد.':'';
  if(title)title.textContent=previewMode?'پیش‌نمایش تمام شد':unavailable?'وضعیت در دسترس نیست':'تکمیل شد!';
  if(statusNode){statusNode.textContent=statusCopy;statusNode.hidden=!statusCopy}
  if(hero)hero.classList.toggle('is-warn',unavailable||!accepted&&!previewMode||previewMode);
  if(icon)icon.setAttribute('href',previewMode?'icons.svg#i-eye':!accepted?'icons.svg#i-clock':'icons.svg#i-check');
  document.title=previewMode?'پیش‌نمایش تمام شد':unavailable?'وضعیت در دسترس نیست':'تکمیل شد!';

  const cta=document.getElementById('ticketDelivery'),ticketImageFrame=document.getElementById('ticketImageFrame');
  const hasTicket=isRegistration&&accepted&&!!deliveryUrl;
  if(cta){cta.hidden=!hasTicket;if(hasTicket)cta.href=deliveryUrl;else cta.removeAttribute('href')}
  if(ticketImageFrame)ticketImageFrame.hidden=!hasTicket;
  if(hasTicket&&formId&&ticketImageFrame){
    const image=ticketImageFrame.querySelector('img');
    if(image){
      image.style.visibility='hidden';
      image.addEventListener('load',()=>{image.style.visibility='visible'},{once:true});
      image.addEventListener('error',()=>{ticketImageFrame.hidden=true},{once:true});
      image.src='/api/public/forms/'+encodeURIComponent(formId)+'/ticket-image';
    }
  }

  const messageNode=document.getElementById('endText');
  const storedEndText=text(form.endText,1000);
  const endText=previewMode?'این فقط پیش‌نمایش محلی است؛ پاسخ ثبت یا ارسال نشده است.':
    storedEndText===LEGACY_END_TEXT?'':storedEndText||DEFAULT_END_TEXT;
  if(messageNode){messageNode.textContent=endText;messageNode.hidden=!endText}

  const linksRoot=document.getElementById('endLinks'),linksList=document.getElementById('endLinksList'),linksHeading=document.getElementById('endLinksHeading');
  const rawLinks=Array.isArray(form.links)?form.links.slice(0,10):[];
  const SOCIAL_NETWORKS=[
    {k:'instagram',mark:'IG',hosts:['instagram.com']},{k:'telegram',mark:'TG',hosts:['t.me','telegram.me']},
    {k:'bale',mark:'ب',hosts:['ble.ir','bale.ai']},{k:'whatsapp',mark:'WA',hosts:['wa.me','whatsapp.com']},
    {k:'youtube',mark:'YT',hosts:['youtube.com','youtu.be']},{k:'aparat',mark:'A',hosts:['aparat.com']},
    {k:'linkedin',mark:'in',hosts:['linkedin.com']},{k:'x',mark:'X',hosts:['x.com','twitter.com']},
    {k:'tiktok',mark:'♪',hosts:['tiktok.com']},{k:'eitaa',mark:'ا',hosts:['eitaa.com']},{k:'rubika',mark:'ر',hosts:['rubika.ir']}
  ];
  const safeEndHref=value=>{
    const raw=text(value,2048);if(!raw||/[\u0000-\u0020]/.test(raw))return '';
    if(/^[A-Za-z0-9][A-Za-z0-9_-]*\.html(?:[?#][A-Za-z0-9_=&%.-]*)*$/.test(raw)){
      try{
        const url=new URL(raw,location.href),leaf=url.pathname.split('/').pop()||'';
        if(url.origin===location.origin&&/^[A-Za-z0-9][A-Za-z0-9_-]*\.html$/.test(leaf))return url.pathname+url.search+url.hash;
      }catch(error){}
      return '';
    }
    if(/^mailto:/i.test(raw)){
      const address=raw.slice(7).split('?')[0];return /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(address)?raw:'';
    }
    if(/^tel:/i.test(raw)){
      const phone=raw.slice(4).split('?')[0].replace(/[().\s-]/g,'');return /^\+?\d{5,20}$/.test(phone)?raw:'';
    }
    try{const url=new URL(raw);if(url.protocol==='https:'&&url.hostname&&!url.username&&!url.password)return url.href}catch(error){}
    return '';
  };
  const networkFor=(item,href)=>{
    const explicit=SOCIAL_NETWORKS.find(network=>network.k===item.social);if(explicit)return explicit;
    try{const host=new URL(href,location.href).hostname.toLowerCase();return SOCIAL_NETWORKS.find(network=>network.hosts.some(domain=>host===domain||host.endsWith('.'+domain)))||null}catch(error){return null}
  };
  if(linksRoot&&linksList){
    linksList.replaceChildren();
    const activeLinks=rawLinks.map(item=>{
      const label=text(item&&item.t,120),href=safeEndHref(item&&item.u);
      return label&&href?{label,href,network:networkFor(item,href)}:null;
    }).filter(Boolean);
    if(activeLinks.length){
      activeLinks.forEach(({label,href,network})=>{
        const node=document.createElement('a');node.className='final-link'+(network?' is-social':'');node.href=href;
        if(/^https:/i.test(href)){node.target='_blank';node.rel='noopener noreferrer'}
        const mark=document.createElement('span');mark.className='final-link-mark';mark.setAttribute('aria-hidden','true');mark.textContent=network?network.mark:'↗';
        const caption=document.createElement('span');caption.textContent=label;node.append(mark,caption);linksList.appendChild(node);
      });
      const socialCount=activeLinks.filter(item=>item.network).length;
      if(linksHeading){linksHeading.hidden=false;linksHeading.textContent=socialCount===activeLinks.length?'شبکه‌های اجتماعی':socialCount?'پیوندها و شبکه‌های اجتماعی':'پیوندهای مفید'}
      linksRoot.hidden=false;
    }
  }
})();
</script>
</body>
</html>
