[mypy]
# Nora's backend supports 3.11; this does not alter Strix's 3.12 requirement.
python_version = 3.11
check_untyped_defs = True
ignore_missing_imports = True
# Test fixtures intentionally use duck-typed records and isolated HTTP fakes.
# Runtime tests still execute separately; do not hide application type errors.
exclude = /tests/
