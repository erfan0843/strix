<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="نشان نورا">
  <defs>
    <!-- آبی به بنفش، از گوشهٔ بالا چپ تا پایین راست -->
    <linearGradient id="nora-g" gradientUnits="userSpaceOnUse" x1="150" y1="160" x2="360" y2="420">
      <stop offset="0" stop-color="#3D63F6"/>
      <stop offset="0.5" stop-color="#6E5CF7"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="nora-g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A6BF8"/>
      <stop offset="1" stop-color="#9A4DF6"/>
    </linearGradient>
    <linearGradient id="nora-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="nora-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A2E6B" flood-opacity="0.18"/>
    </filter>
    <filter id="nora-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5B4BD6" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- زمینهٔ روشن، مثل قاب خود آیکون -->
  <circle cx="256" cy="256" r="256" fill="#F4F5FA"/>
  <circle cx="256" cy="248" r="212" fill="#FFFFFF" opacity="0.55"/>

  <!-- کارت پشتی: گرادیان، کمی بالاتر و پهن‌تر از کارت سفید -->
  <g filter="url(#nora-soft)">
    <rect x="118" y="126" width="286" height="286" rx="52" fill="url(#nora-g2)"/>
  </g>

  <!-- کارت سفید رویی، کج‌شده مثل تصویر -->
  <g transform="rotate(-4 256 280)" filter="url(#nora-shadow)">
    <rect x="126" y="140" width="268" height="278" rx="44" fill="#FFFFFF"/>
    <rect x="126" y="140" width="268" height="278" rx="44" fill="none" stroke="#E7E8F5" stroke-width="1.5"/>
    <path d="M126 184c0-24 20-44 44-44h180c24 0 44 20 44 44v18H126z" fill="url(#nora-sheen)" opacity="0.55"/>
  </g>

  <!-- حرف N: سه قلم هم‌ضخامت، سرگرد -->
  <g transform="rotate(-4 256 280)" stroke="url(#nora-g)" stroke-width="31" stroke-linecap="round" fill="none">
    <path d="M203 197v106"/>
    <path d="M309 197v106"/>
    <path d="M203 197l106 106"/>
  </g>

  <!-- چک‌لیست پای کارت -->
  <g transform="rotate(-4 256 280)">
    <!-- کادر تیک‌خورده -->
    <rect x="170" y="336" width="30" height="30" rx="9" fill="url(#nora-g)"/>
    <path d="M178 351.5l6.5 7 11-14" fill="none" stroke="#FFFFFF" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- سه ردیف -->
    <rect x="210" y="341" width="118" height="12" rx="6" fill="#E7E8F2"/>
    <rect x="210" y="367" width="150" height="12" rx="6" fill="#E7E8F2"/>
    <rect x="210" y="393" width="82" height="12" rx="6" fill="#E7E8F2"/>
    <!-- دو مربع تیک‌نخورده، هم‌تراز ردیف دوم و سوم -->
    <rect x="172" y="365" width="26" height="26" rx="8" fill="#EDEEF6"/>
    <rect x="172" y="391" width="26" height="26" rx="8" fill="#EDEEF6"/>
  </g>
</svg>
